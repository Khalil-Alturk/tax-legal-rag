[project]
name = "tax-legal-rag"
version = "0.1.0"
description = "Tax & Legal Document Q&A: a bilingual (Arabic/English) RAG API with grounded, cited answers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-chroma>=0.2",
    "chromadb>=0.5",
    "pymupdf>=1.24",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
